<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>debug</title>
  </head>
  <body style="margin:0;font:11px monospace;background:#fff;color:#000">
    <pre id="out">running…</pre>
    <script>
      const WIDTHS = [375, 390, 768, 1024, 1440];
      const results = [];

      function testWidth(w) {
        return new Promise((resolve) => {
          const f = document.createElement('iframe');
          f.style.cssText = 'width:' + w + 'px;height:800px;border:0;position:absolute;left:-99999px;top:0';
          f.src = '/';
          document.body.appendChild(f);

          f.addEventListener('load', () => {
            setTimeout(() => {
              try {
                const d = f.contentDocument;
                const de = d.documentElement;
                const vw = de.clientWidth;
                const offenders = [];
                d.querySelectorAll('*').forEach((el) => {
                  const r = el.getBoundingClientRect();
                  if (r.right > vw + 1 || r.left < -1) {
                    offenders.push(
                      el.tagName + '.' + String(el.getAttribute('class') || '').split(' ').slice(0, 2).join('.') +
                      ' [L' + Math.round(r.left) + ' R' + Math.round(r.right) + ']'
                    );
                  }
                });

                // Nav toggle must be present and reachable on small screens.
                const toggle = d.querySelector('button[aria-controls="mobile-nav"]');
                const toggleRect = toggle ? toggle.getBoundingClientRect() : null;

                // Smallest interactive target size.
                let minTap = 999;
                d.querySelectorAll('a[href], button').forEach((el) => {
                  const r = el.getBoundingClientRect();
                  if (r.width > 0 && r.height > 0) minTap = Math.min(minTap, Math.round(r.height));
                });

                results.push(
                  'w=' + w + ' vw=' + vw + ' sw=' + de.scrollWidth +
                  ' overflow=' + offenders.length +
                  ' navToggle=' + (toggleRect ? Math.round(toggleRect.width) + 'x' + Math.round(toggleRect.height) : 'ABSENT') +
                  ' minTapH=' + minTap
                );
                if (offenders.length) results.push('   -> ' + offenders.slice(0, 6).join(' | '));
              } catch (e) {
                results.push('w=' + w + ' ERR ' + e.message);
              }
              f.remove();
              resolve();
            }, 2200);
          });
        });
      }

      (async () => {
        for (const w of WIDTHS) await testWidth(w);
        document.getElementById('out').textContent = results.join('\n');
      })();
    </script>
  </body>
</html>
